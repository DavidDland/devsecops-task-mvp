apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-mvp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-mvp
  template:
    metadata:
      labels:
        app: task-mvp
    spec:
      containers:
        - name: task-mvp
          image: task-mvp:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
